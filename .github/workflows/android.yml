name: Android APK
on:
  push:
    branches: [main, android-native]
  pull_request:
    branches: [main, android-native]
  workflow_dispatch:
    inputs:
      signed:
        description: Build an APK with the permanent release signing key
        type: boolean
        default: false
      upgrade_from_run:
        description: Workflow run ID containing the previous signed APK
        type: string
        default: '45872089797'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-workbench
      - name: Check desktop data and server compatibility
        working-directory: desktop
        run: node --test server/creative-tools.test.mjs server/book-sync.test.mjs server/codex-session.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --channel=3 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
      - name: Run native tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Check release code shrinking
        if: github.event_name != 'workflow_dispatch' || !inputs.signed
        run: gradle --no-daemon :app:minifyReleaseWithR8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qingjian-Native-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  writing-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-workbench
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
      - name: Run native writing flow on an Android emulator
        shell: bash
        run: |
          sdkmanager --channel=3 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd -n qingjian-ci -k 'system-images;android-35;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd qingjian-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/qingjian-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell wm size 1080x2340
          adb shell wm density 480
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          adb install app/build/outputs/apk/debug/app-x86_64-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb logcat -c
          adb shell am instrument -w -r \
            -e class xyz.qingjian.writer.WritingFlowTest \
            io.wboat.writer.debug.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/qingjian-instrumentation.log"
          adb logcat -d -b crash -v brief | tee "$RUNNER_TEMP/qingjian-crash.log"
          adb pull /sdcard/Download/qingjian-qa "$RUNNER_TEMP/qingjian-qa" || true
          grep -Eq '^OK \(([2-9]|[1-9][0-9]+) tests\)' "$RUNNER_TEMP/qingjian-instrumentation.log"
          adb exec-out run-as io.wboat.writer.debug cat files/android-pc-manuscript.json \
            > "$RUNNER_TEMP/qingjian-qa/android-pc-manuscript.json"
          QINGJIAN_ANDROID_ROUNDTRIP="$RUNNER_TEMP/qingjian-qa/android-pc-manuscript.json" \
            node --test --test-name-pattern='PC imports the exchange manuscript' desktop/server/creative-tools.test.mjs
          for name in chapter chapter-tablet providers provider-connection provider-models; do
            test -s "$RUNNER_TEMP/qingjian-qa/$name.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qingjian-Android-writing-flow
          path: |
            ${{ runner.temp }}/qingjian-emulator.log
            ${{ runner.temp }}/qingjian-instrumentation.log
            ${{ runner.temp }}/qingjian-crash.log
            ${{ runner.temp }}/qingjian-qa/

  signed:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android-native')
    needs: [check, writing-flow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-workbench
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --channel=3 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
          cache-disabled: true
      - name: Build and verify release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.QINGJIAN_KEYSTORE_BASE64 }}
          QINGJIAN_STORE_PASSWORD: ${{ secrets.QINGJIAN_STORE_PASSWORD }}
          QINGJIAN_KEY_ALIAS: ${{ secrets.QINGJIAN_KEY_ALIAS }}
          QINGJIAN_KEY_PASSWORD: ${{ secrets.QINGJIAN_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.QINGJIAN_CERT_SHA256 }}
        run: |
          : "${KEYSTORE_BASE64:?Set QINGJIAN_KEYSTORE_BASE64 in Actions secrets}"
          : "${QINGJIAN_STORE_PASSWORD:?Set QINGJIAN_STORE_PASSWORD in Actions secrets}"
          : "${QINGJIAN_KEY_ALIAS:?Set QINGJIAN_KEY_ALIAS in Actions secrets}"
          : "${QINGJIAN_KEY_PASSWORD:?Set QINGJIAN_KEY_PASSWORD in Actions secrets}"
          : "${EXPECTED_CERT_SHA256:?Set QINGJIAN_CERT_SHA256 in Actions variables}"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          export QINGJIAN_KEYSTORE
          QINGJIAN_KEYSTORE="$(mktemp "$RUNNER_TEMP/qingjian.XXXXXX")"
          trap 'rm -f "$QINGJIAN_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$QINGJIAN_KEYSTORE"
          unset KEYSTORE_BASE64
          keytool -exportcert -keystore "$QINGJIAN_KEYSTORE" -storetype PKCS12 \
            -storepass:env QINGJIAN_STORE_PASSWORD -alias "$QINGJIAN_KEY_ALIAS" \
            -file "$RUNNER_TEMP/qingjian-release.cer"
          read -r key_fingerprint _ < <(sha256sum "$RUNNER_TEMP/qingjian-release.cer")
          if [[ "$key_fingerprint" != "$expected" ]]; then
            echo "::error::Stored release key certificate has unexpected SHA-256: $key_fingerprint"
            exit 1
          fi
          version_code=$((100 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --no-build-cache :app:assembleRelease "-PqingjianVersionCode=$version_code"
          sdk_tools="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p release-artifacts
          for abi in arm64-v8a x86_64; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            report="release-artifacts/signature-$abi.txt"
            java --class-path "$sdk_tools/lib/apksigner.jar" .github/scripts/VerifyApk.java "$apk" "$expected" > "$report"
            badging="release-artifacts/package-$abi.txt"
            "$sdk_tools/aapt2" dump badging "$apk" > "$badging"
            grep -F "package: name='io.wboat.writer' versionCode='$version_code' " "$badging"
            grep -Ex "native-code: '$abi'[[:space:]]*" "$badging"
            cp "$apk" "release-artifacts/Qingjian-Android-$abi.apk"
          done
          (cd release-artifacts && sha256sum Qingjian-Android-*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Qingjian-Android-signed
          path: release-artifacts/
          if-no-files-found: error

  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: signed
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Qingjian-Android-signed
          path: previous
          github-token: ${{ github.token }}
          run-id: ${{ inputs.upgrade_from_run }}
      - uses: actions/download-artifact@v4
        with:
          name: Qingjian-Android-signed
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Verify signing lineage and preserve an old manuscript across install
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.QINGJIAN_CERT_SHA256 }}
        run: |
          sdkmanager --channel=3 'platform-tools' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          sdk_tools="$ANDROID_HOME/build-tools/37.0.0"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p upgrade-evidence
          apk=Qingjian-Android-x86_64.apk
          for build in previous candidate; do
            (cd "$build" && sha256sum -c SHA256SUMS)
            java --class-path "$sdk_tools/lib/apksigner.jar" .github/scripts/VerifyApk.java "$build/$apk" "$expected" \
              > "upgrade-evidence/$build-signature.txt"
            "$sdk_tools/aapt2" dump badging "$build/$apk" > "upgrade-evidence/$build-package.txt"
          done
          package_version() {
            sed -n "s/^package: name='io\.wboat\.writer' versionCode='\([0-9][0-9]*\)'.*/\1/p" "upgrade-evidence/$1-package.txt"
          }
          previous_version="$(package_version previous)"
          candidate_version="$(package_version candidate)"
          [[ -n "$previous_version" && -n "$candidate_version" ]]
          (( candidate_version > previous_version ))

          printf 'no\n' | avdmanager create avd -n qingjian-upgrade -k 'system-images;android-35;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd qingjian-upgrade -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > upgrade-evidence/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell wm size 1080x2340
          adb shell wm density 480
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          python3 .github/scripts/verify-android-upgrade.py "previous/$apk" "candidate/$apk" upgrade-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qingjian-Android-signed-upgrade
          path: upgrade-evidence/
