name: Android APK
on:
  push:
    branches: [main, android-native]
  pull_request:
    branches: [main, android-native]
  workflow_dispatch:
    inputs:
      signed:
        description: Build an APK with the permanent release signing key
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --channel=3 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
      - name: Run native tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Check release code shrinking
        if: github.event_name != 'workflow_dispatch' || !inputs.signed
        run: gradle --no-daemon :app:minifyReleaseWithR8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qingjian-Native-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  writing-flow:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
      - name: Run native writing flow on an Android emulator
        shell: bash
        run: |
          sdkmanager --channel=3 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd -n qingjian-ci -k 'system-images;android-35;google_apis;x86_64'
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd qingjian-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/qingjian-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell wm size 1080x2340
          adb shell wm density 480
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qingjian-Android-writing-flow
          path: |
            app/build/reports/androidTests/
            ${{ runner.temp }}/qingjian-emulator.log

  signed:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android-native')
    needs: [check, writing-flow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --channel=3 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
          cache-disabled: true
      - name: Build and verify release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.QINGJIAN_KEYSTORE_BASE64 }}
          QINGJIAN_STORE_PASSWORD: ${{ secrets.QINGJIAN_STORE_PASSWORD }}
          QINGJIAN_KEY_ALIAS: ${{ secrets.QINGJIAN_KEY_ALIAS }}
          QINGJIAN_KEY_PASSWORD: ${{ secrets.QINGJIAN_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.QINGJIAN_CERT_SHA256 }}
        run: |
          : "${KEYSTORE_BASE64:?Set QINGJIAN_KEYSTORE_BASE64 in Actions secrets}"
          : "${QINGJIAN_STORE_PASSWORD:?Set QINGJIAN_STORE_PASSWORD in Actions secrets}"
          : "${QINGJIAN_KEY_ALIAS:?Set QINGJIAN_KEY_ALIAS in Actions secrets}"
          : "${QINGJIAN_KEY_PASSWORD:?Set QINGJIAN_KEY_PASSWORD in Actions secrets}"
          : "${EXPECTED_CERT_SHA256:?Set QINGJIAN_CERT_SHA256 in Actions variables}"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          export QINGJIAN_KEYSTORE
          QINGJIAN_KEYSTORE="$(mktemp "$RUNNER_TEMP/qingjian.XXXXXX")"
          trap 'rm -f "$QINGJIAN_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$QINGJIAN_KEYSTORE"
          unset KEYSTORE_BASE64
          keytool -exportcert -keystore "$QINGJIAN_KEYSTORE" -storetype PKCS12 \
            -storepass:env QINGJIAN_STORE_PASSWORD -alias "$QINGJIAN_KEY_ALIAS" \
            -file "$RUNNER_TEMP/qingjian-release.cer"
          read -r key_fingerprint _ < <(sha256sum "$RUNNER_TEMP/qingjian-release.cer")
          if [[ "$key_fingerprint" != "$expected" ]]; then
            echo "::error::Stored release key certificate has unexpected SHA-256: $key_fingerprint"
            exit 1
          fi
          version_code=$((100 + GITHUB_RUN_NUMBER))
          gradle --no-daemon --no-build-cache :app:assembleRelease "-PqingjianVersionCode=$version_code"
          sdk_tools="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p release-artifacts
          for abi in arm64-v8a x86_64; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            report="release-artifacts/signature-$abi.txt"
            java --class-path "$sdk_tools/lib/apksigner.jar" .github/scripts/VerifyApk.java "$apk" "$expected" > "$report"
            cp "$apk" "release-artifacts/Qingjian-Android-$abi.apk"
          done
          (cd release-artifacts && sha256sum Qingjian-Android-*.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: Qingjian-Android-signed
          path: release-artifacts/
          if-no-files-found: error
