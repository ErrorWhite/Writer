name: PC and server packages
on:
  push:
    branches: [android-native, main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    branches: [android-native, main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node --test server/*.test.mjs
      - run: npm run build
      - name: Package server and web UI
        run: tar -czf ../Qingjian-server.tar.gz dist src server package.json package-lock.json orison-attribution.txt orison/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: Qingjian-server
          path: Qingjian-server.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run package:windows -- ../windows
      - uses: actions/upload-artifact@v4
        with:
          name: Qingjian-Windows
          path: windows/Qingjian-*-Windows-x64.zip
          if-no-files-found: error
