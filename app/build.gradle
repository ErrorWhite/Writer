plugins {
    id 'com.android.application' version '9.5.2'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    id 'com.google.devtools.ksp' version '2.3.13'
}

def signingVariables = ['QINGJIAN_KEYSTORE', 'QINGJIAN_STORE_PASSWORD', 'QINGJIAN_KEY_ALIAS', 'QINGJIAN_KEY_PASSWORD']
def signingValues = signingVariables.collectEntries { [(it): providers.environmentVariable(it).orNull] }
def signed = signingValues.values().every { it }
if (!signed && signingValues.values().any { it }) {
    throw new GradleException('All four QINGJIAN signing variables are required together.')
}

android {
    namespace 'xyz.qingjian.writer'
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }

    defaultConfig {
        applicationId 'io.wboat.writer'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('qingjianVersionCode').map { it.toInteger() }.getOrElse(2)
        versionName '0.2.0'
    }

    if (signed) {
        signingConfigs {
            release {
                storeFile file(signingValues.QINGJIAN_KEYSTORE)
                storeType 'PKCS12'
                storePassword signingValues.QINGJIAN_STORE_PASSWORD
                keyAlias signingValues.QINGJIAN_KEY_ALIAS
                keyPassword signingValues.QINGJIAN_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (signed) signingConfig signingConfigs.release
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ksp { arg('room.schemaLocation', "$projectDir/schemas") }

dependencies {
    implementation 'io.github.suqi8.coui.kmp:coui-ui-android:2.1.0'
    implementation 'io.github.suqi8.coui.kmp:coui-preference-android:2.1.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3:1.5.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.1'
    implementation 'androidx.navigation:navigation-compose:2.8.8'
    implementation 'androidx.room:room-runtime:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'
    implementation 'androidx.sqlite:sqlite-bundled:2.5.0'
    ksp 'androidx.room:room-compiler:2.7.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.3'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.24.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'org.snakeyaml:snakeyaml-engine:2.9'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
